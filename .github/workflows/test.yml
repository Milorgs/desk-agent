name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      DESK_NO_ARROW: 1
    strategy:
      matrix:
        mode: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libjson-c-dev libssl-dev libatspi2.0-dev libreadline-dev
      - name: Build and run tests
        run: |
          if [ '${{ matrix.mode }}' = sanitize ]; then
            make sanitize
          else
            make test
            make test-mcp-http
            ./build/desk --version
            ./install.sh --prefix "$RUNNER_TEMP/desk-install"
            "$RUNNER_TEMP/desk-install/bin/desk" --version
          fi

      - name: Package Linux executable
        if: matrix.mode == 'release'
        run: |
          mkdir -p dist/desk-agent-linux-x64
          install -m 755 build/desk dist/desk-agent-linux-x64/desk
          strip dist/desk-agent-linux-x64/desk
          install -m 755 linux/install.sh dist/desk-agent-linux-x64/install.sh
          cp linux/README.txt dist/desk-agent-linux-x64/
          ldd dist/desk-agent-linux-x64/desk > dist/desk-agent-linux-x64/DEPENDENCIES.txt
          tar -C dist -czf dist/desk-agent-linux-x64.tar.gz desk-agent-linux-x64
          (cd dist && sha256sum desk-agent-linux-x64.tar.gz > SHA256SUMS-linux.txt)
          mkdir -p "$RUNNER_TEMP/desk-package-check"
          tar -xzf dist/desk-agent-linux-x64.tar.gz -C "$RUNNER_TEMP/desk-package-check"
          sh "$RUNNER_TEMP/desk-package-check/desk-agent-linux-x64/install.sh" --prefix "$RUNNER_TEMP/desk-binary-install"
          "$RUNNER_TEMP/desk-binary-install/bin/desk" --version
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'release'
        with:
          name: desk-agent-linux-x64
          if-no-files-found: error
          path: |
            dist/desk-agent-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-x64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-x64-static-
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout db00e0c76ae37ede9464c157a3ec8653f8fbb494
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Build Windows x64
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          cmake -S . -B build/windows -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test Windows native behavior
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/windows/Release/desk.exe --version
          & ./build/windows/Release/desk.exe --lang en --help
      - name: Package Windows executable
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desk-agent-windows-x64 | Out-Null
          Copy-Item build/windows/Release/desk.exe dist/desk-agent-windows-x64/
          Copy-Item windows/install.ps1,windows/README.txt dist/desk-agent-windows-x64/
          New-Item -ItemType Directory -Force dist/desk-agent-windows-x64/licenses | Out-Null
          Get-ChildItem build/windows/vcpkg_installed/x64-windows-static/share -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName 'copyright'
            if (Test-Path $copyright) { Copy-Item $copyright "dist/desk-agent-windows-x64/licenses/$($_.Name).txt" }
          }
          Compress-Archive -Path dist/desk-agent-windows-x64/* -DestinationPath dist/desk-agent-windows-x64.zip
          $digest = (Get-FileHash dist/desk-agent-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  desk-agent-windows-x64.zip" | Set-Content dist/SHA256SUMS-windows.txt -Encoding ASCII
          $version = (& dist/desk-agent-windows-x64/desk.exe --version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          & powershell -NoProfile -ExecutionPolicy Bypass -File dist/desk-agent-windows-x64/install.ps1 -Prefix "$env:RUNNER_TEMP/desk-install" -NoPath
          & "$env:RUNNER_TEMP/desk-install/desk.exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: desk-agent-windows-x64
          path: |
            dist/desk-agent-windows-x64.zip
            dist/SHA256SUMS-windows.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-x64-static-${{ hashFiles('vcpkg.json') }}
  release:
    needs: [test, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-agent-*-x64
          merge-multiple: true
          path: dist
      - name: Publish Windows and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESK_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v$DESK_VERSION"
          cat dist/SHA256SUMS-linux.txt dist/SHA256SUMS-windows.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published package."
          else
            gh release create "$tag" dist/desk-agent-windows-x64.zip dist/desk-agent-linux-x64.tar.gz dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "desk-agent $DESK_VERSION — Windows / Linux" --notes-file "docs/releases/$tag.md"
          fi
