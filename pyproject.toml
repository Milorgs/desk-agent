[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-agent-cli"
version = "0.2.0"
description = "An independent Linux CLI agent for files, shell, and accessible desktop apps"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
desk = "desk_agent.cli:main"

[tool.setuptools.packages.find]
include = ["desk_agent*"]
